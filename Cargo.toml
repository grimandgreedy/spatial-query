[workspace]
# Root is both the core package and the workspace root. The
# `spatial-query-viewport-examples` member lands at Phase 2E; it carries the
# viewport-lib dependency so the core package stays viewport-free.
members = ["examples-viewport"]

[package]
name = "spatial-query"
version = "0.0.0"
edition = "2021"
description = "Host-agnostic, N-dimensional spatial acceleration and query engine (BVH, ray/shape/overlap) over an arbitrary set of objects in n-space."
repository = ""
readme = "README.md"

[features]
# Default is the pure-CPU, host-agnostic core: no wgpu, no renderer, no physics.
default = []
# Optional GPU-compute traversal backend. Pulls wgpu into the graph; the core
# stays usable and correct without it. See docs/plans for the phase that lands this.
gpu = []
# Optional double-precision query math for consumers that need it (determinism
# / large-coordinate scenes). Off by default.
f64 = []

[dependencies]
# The core is N-dimensional (ADR-002): the point type is const-generic
# `[f32; D]`, not glam::Vec3, so glam is intentionally NOT a core dependency.
# glam lives only in the 3D adapters and examples.

[dev-dependencies]
