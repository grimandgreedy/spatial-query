# Virtual workspace root. Each crate lives under `crates/`:
#   crates/spatial-query          - the core engine (host-agnostic, dependency-light)
#   crates/viewport-lib-query     - the reference render-side adapter (carries viewport-lib)
#   crates/examples-viewport      - visual examples (carries viewport-lib)
# The core stays viewport-free; only the adapter and examples pull viewport-lib in.
[workspace]
resolver = "2"
members = [
    "crates/spatial-query",
    "crates/viewport-lib-query",
    "crates/examples-viewport",
]
